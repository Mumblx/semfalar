name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Preparar projeto
        run: |
          python3 -c "import base64; d=''.join(open(f).read().strip() for f in ['p0','p1','p2','p3']); open('p.txz','wb').write(base64.urlsafe_b64decode(d+'='*(-len(d)%4)))"
          tar -xJf p.txz
          if [ ! -f ci.keystore ]; then
            keytool -genkeypair -keystore ci.keystore -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SemFalar"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci.keystore
            git commit -m "Chave de assinatura"
            git push
          fi
          cp ci.keystore SemFalar/app/ci.keystore
      - name: Compilar
        working-directory: SemFalar
        run: gradle --no-daemon assembleDebug
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SemFalar/app/build/outputs/apk/debug/app-debug.apk SemFalar.apk
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest SemFalar.apk --title "Sem Falar" --notes "Baixe o SemFalar.apk e toque nele para instalar." --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: SemFalar-apk
          path: SemFalar.apk
